<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせありがとうございます | Saku</title>
<style>
:root{--teal:#426D78;--pink:#BF8DA8;--pale:#F5E4EC;--white:#fff;}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--teal);font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;color:var(--teal);display:flex;align-items:center;justify-content:center;padding:28px}
.wrap{width:min(760px,100%);background:var(--white);border:1px solid rgba(255,255,255,.75);box-shadow:0 18px 50px rgba(0,0,0,.08);padding:72px 42px;text-align:center;position:relative}
.wrap:before{content:"";position:absolute;inset:10px;border:1px solid var(--pale);pointer-events:none}
.eyebrow{font-family:Georgia,"Times New Roman",serif;letter-spacing:.16em;color:var(--pink);font-size:14px;margin:0 0 18px}
h1{font-size:clamp(25px,4vw,38px);font-weight:500;line-height:1.5;margin:0 0 24px;color:var(--pink)}
p{font-size:clamp(16px,2.4vw,20px);line-height:2;margin:0;color:var(--teal)}
a{display:inline-flex;align-items:center;justify-content:center;margin-top:38px;min-width:220px;height:54px;padding:0 28px;border-radius:999px;background:var(--pink);color:#fff;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:15px;font-weight:700}
@media(max-width:600px){
  body{min-height:100svh;padding:12px;overflow:hidden}
  .wrap{width:100%;max-width:390px;max-height:calc(100svh - 24px);padding:38px 22px 34px}
  .wrap:before{inset:8px}
  .eyebrow{font-size:13px;margin-bottom:14px}
  h1{font-size:29px;line-height:1.45;margin-bottom:18px}
  p{font-size:17px;line-height:1.85}
  a{width:100%;max-width:270px;height:52px;margin-top:28px}
}
</style>
</head>
<body>
<main class="wrap">
<p class="eyebrow">THANK YOU</p>
<h1>お問い合わせ<br>ありがとうございます。</h1>
<p>内容を確認のうえ、<br>3日以内にご連絡いたします。</p>
<a href="https://t0i3t02u1maga4-dotcom.github.io/saku-portfolio/">ポートフォリオに戻る</a>
</main>
</body>
</html>
